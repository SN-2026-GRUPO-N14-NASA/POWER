<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASA POWER - Clima e Energia Solar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0b1220;
  --card: #141d31;
  --borda: #24304d;
  --texto: #e8edf7;
  --suave: #9aa8c7;
  --destaque: #4da3ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--texto);
}
header {
  padding: 24px 20px 8px;
  max-width: 1100px;
  margin: 0 auto;
}
h1 { margin: 0 0 4px; font-size: 1.6rem; }
.sub { color: var(--suave); margin: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 40px; }
.controles {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin: 16px 0;
  align-items: end;
}
label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--suave); }
select {
  background: var(--card);
  color: var(--texto);
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 1rem;
  min-width: 220px;
}
.atualizacao {
  margin-left: auto;
  font-size: 0.85rem;
  color: var(--suave);
  text-align: right;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.card, .painel {
  background: var(--card);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 16px;
}
.card .rotulo { font-size: 0.8rem; color: var(--suave); }
.card .valor { font-size: 1.8rem; font-weight: 700; margin-top: 6px; color: var(--destaque); }
.painel { margin-bottom: 18px; }
.painel h2 { margin: 0 0 12px; font-size: 1.1rem; }
.grafico { position: relative; height: 320px; }
.tabela-wrap { max-height: 360px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--borda); }
th:first-child, td:first-child { text-align: left; }
th { position: sticky; top: 0; background: var(--card); color: var(--suave); font-weight: 600; }
.erro { color: #ff8a8a; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>NASA POWER: Clima e Energia Solar</h1>
  <p class="sub">Dados climatológicos diários por coordenada geográfica</p>
</header>
<main>
  <div class="controles">
    <label>Cidade
      <select id="filtroLocal"></select>
    </label>
    <label>Variável do gráfico
      <select id="filtroVariavel">
        <option value="temp_media">Temperatura média (°C)</option>
        <option value="precipitacao">Precipitação (mm/dia)</option>
        <option value="radiacao_solar">Radiação solar (kWh/m²/dia)</option>
        <option value="vento">Vento a 2 m (m/s)</option>
        <option value="umidade">Umidade relativa (%)</option>
      </select>
    </label>
    <div class="atualizacao" id="ultimaAtualizacao">Carregando...</div>
  </div>

  <div id="mensagemErro" class="erro"></div>

  <div class="cards">
    <div class="card"><div class="rotulo">Temperatura média</div><div class="valor" id="cardTemp">-</div></div>
    <div class="card"><div class="rotulo">Chuva acumulada</div><div class="valor" id="cardChuva">-</div></div>
    <div class="card"><div class="rotulo">Radiação solar média</div><div class="valor" id="cardRad">-</div></div>
    <div class="card"><div class="rotulo">Dias com dados</div><div class="valor" id="cardDias">-</div></div>
  </div>

  <div class="painel">
    <h2 id="tituloGrafico">Evolução diária</h2>
    <div class="grafico"><canvas id="grafico"></canvas></div>
  </div>

  <div class="painel">
    <h2>Registros</h2>
    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Temp. (°C)</th>
            <th>Chuva (mm)</th>
            <th>Radiação (kWh/m²)</th>
            <th>Vento (m/s)</th>
            <th>Umidade (%)</th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>
  </div>
</main>
  
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
